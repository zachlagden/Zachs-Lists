name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv venv .venv
      - run: uv pip install -r backend/requirements-dev.txt
      - run: uv run --no-project pytest backend/tests --disable-warnings
        env:
          PYTHONPATH: backend
      - run: uv run --no-project mypy --implicit-optional --ignore-missing-imports --follow-imports=silent backend/app/utils/safe_http.py backend/app/utils/validators.py backend/app/utils/api_input.py backend/app/models/user.py backend/app/blueprints/user.py backend/app/socketio.py backend/app/services/http_client.py backend/tests
        env:
          PYTHONPATH: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend build
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --manifest-path rust-worker/Cargo.toml --locked
