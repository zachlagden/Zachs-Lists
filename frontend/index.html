<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f9" />
    <meta
      name="description"
      content="Zach's Lists builds one DNS blocklist from the sources you choose, for Pi-hole, AdGuard Home or your browser."
    />
    <title>Zach's Lists</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('zl-theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (error) {
        delete document.documentElement.dataset.theme;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
